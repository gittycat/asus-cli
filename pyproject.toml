[project]
name = "asus-cli"
version = "0.4.0"
description = "CLI program to query and modify an ASUS RT-AX59U router over its HTTP API"
readme = "README.md"
authors = [
    { name = "Main Admin", email = "accounts@kiluna.com" }
]
requires-python = ">=3.13"
dependencies = [
    "asusrouter>=1.21.3",
    "python-dotenv>=1.2.3",
]

[project.scripts]
asus-cli = "asus_cli.cli:main"
probe = "asus_cli.probe:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# helpers.py is imported by name from the test modules.
pythonpath = ["tests"]
addopts = "-q --strict-markers"
