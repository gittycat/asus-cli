[project]
name = "asus-skill"
version = "0.1.0"
description = "Feasibility probe for controlling an ASUS RT-AX59U over its HTTP API"
readme = "README.md"
authors = [
    { name = "Main Admin", email = "accounts@kiluna.com" }
]
requires-python = ">=3.13"
dependencies = [
    "asusrouter>=1.21.3",
    "python-dotenv>=1.2.3",
]

[project.scripts]
asus = "asus_skill.cli:main"
probe = "asus_skill.probe:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"
